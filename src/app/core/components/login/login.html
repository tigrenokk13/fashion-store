<div class="auth-container">
  <h2>Вхід в систему</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email:</label>
      <input type="email" formControlName="email" class="form-control">
      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
        Введіть коректний email
      </small>
    </div>

    <div class="form-group">
      <label>Пароль:</label>
      <input type="password" formControlName="password" class="form-control">
      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
        Пароль має бути мін. 6 символів
      </small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">Увійти</button>
  </form>
</div>
