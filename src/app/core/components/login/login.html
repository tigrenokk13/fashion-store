<div class="auth-container">
  <div class="login-card">
    <h2>Вхід</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="example@mail.com">
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
          Введіть дійсний email
        </small>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" formControlName="password" class="form-control" placeholder="••••••••">
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Мінімум 6 символів
        </small>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">Увійти</button>
    </form>
  </div>
</div>
