<div class="form-container">
  <h2>Додати новий товар</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Назва товару</label>
      <input id="title" type="text" formControlName="title" placeholder="Введіть назву...">
    </div>

    <div class="form-group">
      <label for="description">Опис</label>
      <textarea id="description" formControlName="description" rows="3" placeholder="Детальний опис товару..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="price">Ціна ($)</label>
        <input id="price" type="number" formControlName="price">
      </div>

      <div class="form-group">
        <label for="quantity">Кількість</label>
        <input id="quantity" type="number" formControlName="quantity">
      </div>
    </div>

    <div class="form-group">
      <label for="category">Категорія</label>
      <select id="category" formControlName="category">
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="imageUrl">Посилання на фото (URL)</label>
      <input id="imageUrl" type="text" formControlName="imageUrl" placeholder="https://example.com/image.jpg">
    </div>

    <button type="submit" class="submit-btn">
      Зберегти товар
    </button>
  </form>
</div>
